name: vku_expense_ocr
description: "VKU Receipt OCR & Expense Tracker with Gemini AI"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # OCR & Image Picker (Theo rubric VKU slide 43, cập nhật tương thích SDK mới)
  google_mlkit_text_recognition: ^0.14.0
  image_picker: ^1.0.7
  
  # State Management & Routing (Riverpod 2 & GoRouter)
  flutter_riverpod: ^2.5.1
  go_router: ^13.2.0
  
  # Local Database SQLite (Offline storage)
  sqflite: ^2.3.2
  path: ^1.9.0
  
  # Date formatting & Internationalization
  intl: ^0.19.0

  # AI Gemini API (Phân tích chi tiêu, gợi ý tiết kiệm)
  google_generative_ai: ^0.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  sqflite_common_ffi: ^2.3.2

flutter:
  uses-material-design: true
